[project]
name = "studio-sidecar"
version = "0.1.0"
description = "Python sidecar exposing a unified HTTP protocol for transformers-based engines"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
transformers = ["transformers>=4.40", "torch>=2.2"]
indextts = ["transformers>=4.40", "torch>=2.2", "torchaudio>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
studio-sidecar = "studio_sidecar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio_sidecar*"]
