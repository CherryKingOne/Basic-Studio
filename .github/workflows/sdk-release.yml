name: sdk-release

# 打 tag 后构建并发布各语言 SDK 产物：
#   git tag 0.0.1 && git push origin 0.0.1
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: build python artifacts
        run: |
          python -m pip install --upgrade build
          python -m build sdk/python --outdir dist/python

      - name: build nodejs artifact
        run: npm pack --pack-destination ../dist/nodejs
        working-directory: sdk/nodejs

      - name: build rust artifact
        run: cargo package -p studio-sdk --allow-dirty --no-verify

      - name: build java artifact
        run: mvn -q -f sdk/java/pom.xml -DskipTests package

      - name: verify go module
        run: go vet ./... && go test ./...
        working-directory: sdk/go

      - name: collect artifacts
        run: |
          mkdir -p dist/rust
          cp target/package/*.crate dist/rust/ 2>/dev/null || true
          mkdir -p dist/java
          cp sdk/java/target/*.jar dist/java/ 2>/dev/null || true

      - name: upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      - name: publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true

  publish-python:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-${{ github.ref_name }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python

  publish-node:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-${{ github.ref_name }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: npm publish
        run: npm publish --access public
        working-directory: dist/nodejs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-crates:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        run: cargo publish -p studio-sdk --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" --allow-dirty

  publish-java:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: ossrh
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN
      - name: maven deploy
        run: mvn -q -f sdk/java/pom.xml -DskipTests deploy
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}