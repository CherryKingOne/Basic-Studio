# 单机编排：studio 控制面 + vLLM / SGLang + sidecar
#
# 用法：
#   docker compose up -d studio                 # 只起控制面（引擎用外部地址）
#   docker compose --profile vllm up -d         # 额外起 vLLM
#   docker compose --profile sglang up -d       # 额外起 SGLang
#   docker compose --profile gpu up -d          # 需要 GPU（见 docker-compose.gpu.yml）

services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: basic-studio:latest
    container_name: studio
    restart: unless-stopped
    ports:
      - "18596:18596"
    volumes:
      - ./models:/models:ro
      - ./config:/app/config:ro
      - studio-logs:/app/logs
    environment:
      STUDIO_CONFIG: /app/config/default.toml
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "studio", "doctor", "--config", "/app/config/default.toml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
      args:
        EXTRAS: transformers
    image: basic-studio-sidecar:latest
    container_name: studio-sidecar
    profiles: ["sidecar"]
    restart: unless-stopped
    # 内部端口 18596，仅容器网络可见（studio 通过服务名访问）
    expose:
      - "18596"
    volumes:
      - ./models:/models:ro

  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    profiles: ["vllm"]
    restart: unless-stopped
    command:
      - "--model"
      - "/models/DM/laya"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "18596"
    ports:
      - "18596:18596"
    volumes:
      - ./models:/models:ro
    ipc: host
    shm_size: "16gb"

  sglang:
    image: lmsysorg/sglang:latest
    container_name: sglang
    profiles: ["sglang"]
    restart: unless-stopped
    command:
      - "python"
      - "-m"
      - "sglang.launch_server"
      - "--model-path"
      - "/models/DM/laya"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "18596"
    ports:
      - "18596:18596"
    volumes:
      - ./models:/models:ro
    ipc: host
    shm_size: "16gb"

volumes:
  studio-logs: